<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <rect x="20" y="20" width="260" height="120" rx="8" fill="#f3f4f6" stroke="#111827"/>
  <text x="150" y="50" font-size="16" text-anchor="middle" fill="#111827">Frontend (Vite + React)</text>
  <text x="150" y="72" font-size="12" text-anchor="middle" fill="#374151">/login, /employee, /manager, /admin</text>

  <rect x="320" y="20" width="260" height="120" rx="8" fill="#fef3c7" stroke="#92400e"/>
  <text x="450" y="50" font-size="16" text-anchor="middle" fill="#92400e">Backend (Express + Node)</text>
  <text x="450" y="72" font-size="12" text-anchor="middle" fill="#92400e">REST API: /api/*</text>

  <rect x="620" y="20" width="260" height="120" rx="8" fill="#ecfeff" stroke="#064e3b"/>
  <text x="750" y="50" font-size="16" text-anchor="middle" fill="#064e3b">SQLite (Prisma)</text>
  <text x="750" y="72" font-size="12" text-anchor="middle" fill="#065f46">dev.db + migrations via prisma</text>

  <line x1="280" y1="80" x2="320" y2="80" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="80" x2="620" y2="80" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827" />
    </marker>
  </defs>

  <g transform="translate(60,180)">
    <rect x="0" y="0" width="760" height="340" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="380" y="26" font-size="14" text-anchor="middle" fill="#111827">Key Features</text>

    <text x="60" y="60" font-size="12" fill="#111827">• Goal creation, validation (weightage=100%, max 8, min 10%)</text>
    <text x="60" y="86" font-size="12" fill="#111827">• Approval workflow (Manager approve / return; Admin unlock)</text>
    <text x="60" y="112" font-size="12" fill="#111827">• SharedGoal model: admin pushes a single SharedGoal to many employees</text>
    <text x="60" y="138" font-size="12" fill="#111827">  → Goals reference SharedGoal; achievements sync across linked goals</text>
    <text x="60" y="164" font-size="12" fill="#111827">• Quarterly check-ins with window enforcement and computed scoring</text>
    <text x="60" y="190" font-size="12" fill="#111827">• Escalation module: submission, approval, and check-in overdue alerts</text>
    <text x="60" y="216" font-size="12" fill="#111827">• Audit log captures changes to goals/achievements</text>
    <text x="60" y="242" font-size="12" fill="#111827">• CSV export & basic analytics (QoQ trends, manager effectiveness)</text>
  </g>
</svg>